name: Publicar atualizacao do WavsResolver

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - main.cjs
      - preload.cjs
      - renderer.js
      - index.html
      - styles.css
      - wavs.ico
      - package.json
      - package-lock.json
      - electron-builder.config.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular a proxima versao
        run: |
          $latest = gh release list --limit 1 --exclude-drafts --json tagName | ConvertFrom-Json
          if (-not $latest -or -not $latest[0].tagName) { throw "Nao foi possivel ler a ultima release publicada." }
          $baseVersion = $latest[0].tagName -replace '^v', ''
          npm version $baseVersion --no-git-tag-version
          npm version patch --no-git-tag-version
          Write-Output "Versao desta compilacao: $(node -p "require('./package.json').version")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar release antes do upload
        run: |
          $appVersion = node -p "require('./package.json').version"
          $releases = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          $draftExists = @($releases | Where-Object { $_.tagName -eq "v$appVersion" -and $_.isDraft }).Count -gt 0
          if ($draftExists) {
            gh release delete "v$appVersion" --yes
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel limpar o rascunho anterior." }
          }
          gh release create "v$appVersion" --draft --title "$appVersion" --notes "Instalador Windows do WavsResolver e arquivos de atualizacao automatica."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar instalador e publicar assets
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar arquivos do app empacotado
        run: |
          node -e "const asar=require('@electron/asar'); const files=asar.listPackage('release/build/win-unpacked/resources/app.asar', {}).map(path=>path.replace(/^[\\/]+/, '').split(String.fromCharCode(92)).join('/')); const required=['node_modules/electron-updater/package.json','main.cjs']; const missing=required.filter(path=>!files.includes(path)); if(missing.length) throw new Error('Arquivos ausentes no app.asar: '+missing.join(', ')); console.log('Arquivos verificados no app.asar: '+required.join(', '));"
          if (!(Test-Path 'release/build/win-unpacked/resources/wavs.ico')) { throw "wavs.ico ausente no pacote." }
          $updateConfigPath = 'release/build/win-unpacked/resources/app-update.yml'
          if (!(Test-Path $updateConfigPath)) { throw "app-update.yml ausente; o instalador nao podera verificar atualizacoes." }
          $updateConfig = Get-Content $updateConfigPath -Raw
          if ($updateConfig -notmatch 'provider:\s*github' -or $updateConfig -notmatch 'owner:\s*beatsbyteezo-creator' -or $updateConfig -notmatch 'repo:\s*wavsresolver') { throw "app-update.yml nao aponta para a release publica esperada." }
          Write-Output "Configuracao do atualizador verificada: $updateConfigPath"

      - name: Publicar release para o atualizador
        run: |
          $appVersion = node -p "require('./package.json').version"
          gh release edit "v$appVersion" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
